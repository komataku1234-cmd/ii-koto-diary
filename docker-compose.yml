services:            #複数コンテナを作るためのサービス定義の開始
  app:
    build: .           #Dockerfileを使ってイメージをビルドする
    container_name: ii-koto-diary-app
    volumes:
      - .:/app                      # ソースコードをマウント バインドマウント
      - node_modules:/app/node_modules  # node_modules は名前付きボリュームで高速化 ボリュームマウント
    working_dir: /app                         #Dockerfileと一緒のパスにする
    ports:
      - "3001:3001"                    #左ローカルホスト、右コンテナ内のポート番号(package.jsonのscriptsのdevで指定したポート番号)
    command: sleep infinity         # Dev Container 用に待機させる　起動し続ける
    depends_on:
      - db                          # db を先に起動する　先に起動しているだけで、dbが起動完了しているわけではないので注意

  db:
    image: postgres:18
    container_name: ii-koto-diary-db
    environment:
      # ${...}は.envファイル(プロジェクト直下、git管理外)から自動で読み込まれる。
      # docker-compose.ymlはgitにコミットされるため、直書きせずここに変数として渡すことで
      # 実際の値がリポジトリに残らないようにしている
      POSTGRES_USER: ${POSTGRES_USER}       # 初回起動時に作られるユーザー
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}   # そのパスワード(ローカル開発専用)
      POSTGRES_DB: ${POSTGRES_DB}    # 初回起動時に作られるデータベース名
    volumes:
      - db_data:/var/lib/postgresql  # データを永続化(18以降 は /data を付けない) 公式でそうなったみたい

volumes:        #ボリューム宣言
  node_modules:
  db_data: